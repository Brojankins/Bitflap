<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finding Health — preview</title>
<style>
  @font-face { font-family: "Instrument Serif"; src: url(assets/fonts/instrument-serif-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Instrument Serif"; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  @font-face { font-family: "Inter Tight"; src: url(assets/fonts/inter-tight-latin-300-normal.woff2) format("woff2"); font-weight: 300; }
  @font-face { font-family: "Inter Tight"; src: url(assets/fonts/inter-tight-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Inter Tight"; src: url(assets/fonts/inter-tight-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: "IBM Plex Mono"; src: url(assets/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "IBM Plex Mono"; src: url(assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
  :root { --bg: #0b0a09; --fg: #e9e1d2; --dim: #8a8174; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px "IBM Plex Mono", monospace; }
  body.render { overflow: hidden; }
  body.render #ui { display: none; }
  #stage { display: block; margin: 0 auto; max-width: 100vw; max-height: calc(100vh - 96px); aspect-ratio: 16/9; background: #000; }
  body.render #stage { max-height: none; }
  #ui { padding: 10px 16px; display: grid; gap: 8px; }
  #row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { background: #1c1916; color: var(--fg); border: 1px solid #3a342d; padding: 5px 10px; font: inherit; cursor: pointer; }
  input[type=range] { width: 100%; }
  #scenes { display: flex; gap: 4px; flex-wrap: wrap; }
  #scenes button { font-size: 11px; color: var(--dim); }
  #scenes button.on { color: var(--fg); border-color: #c9953f; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<div id="ui">
  <div id="row">
    <button id="play">play</button>
    <span id="tc">00:00:00</span>
    <span id="sc"></span>
    <label><input type="checkbox" id="half"> half-res</label>
  </div>
  <input id="scrub" type="range" min="0" value="0">
  <div id="scenes"></div>
</div>
<script type="module">
  import { init, renderFrame, FRAMES, FPS, SCENES } from './src/film.js';
  const q = new URLSearchParams(location.search);
  const scale = parseFloat(q.get('scale') || '1');
  const cv = document.getElementById('stage');
  cv.width = Math.round(1920 * scale); cv.height = Math.round(1080 * scale);
  const g = cv.getContext('2d');
  if (q.has('render')) document.body.classList.add('render');

  await init();
  let frame = parseInt(q.get('f') || '0');
  const draw = () => renderFrame(g, frame);

  // Headless render hook (used by render/render.mjs)
  window.FH = {
    frames: FRAMES, fps: FPS, scenes: SCENES,
    draw(f) { frame = f; return renderFrame(g, f); },
    async grab(f, type = 'image/jpeg', quality = 0.93) { renderFrame(g, f); return cv.toDataURL(type, quality); },
  };
  window.FH_READY = true;
  if (q.has('render')) { draw(); }
  else {
    const scrub = document.getElementById('scrub');
    scrub.max = FRAMES - 1;
    const tc = document.getElementById('tc'), sc = document.getElementById('sc');
    const sb = document.getElementById('scenes');
    SCENES.forEach((s) => { const b = document.createElement('button'); b.textContent = s.title; b.onclick = () => { frame = Math.round(s.start * FPS); show(); }; s.btn = b; sb.appendChild(b); });
    const show = () => {
      const r = draw();
      scrub.value = frame;
      const sec = frame / FPS;
      tc.textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(Math.floor(sec % 60)).padStart(2, '0')}:${String(frame % FPS).padStart(2, '0')}  f${frame}`;
      sc.textContent = `${r.scene}  t=${r.t.toFixed(2)}`;
      SCENES.forEach((s) => s.btn.classList.toggle('on', s.id === r.scene));
    };
    scrub.oninput = () => { frame = +scrub.value; show(); };
    document.getElementById('half').onchange = (e) => { const k = e.target.checked ? 0.5 : 1; cv.width = 1920 * k; cv.height = 1080 * k; show(); };
    let playing = false, t0 = 0, f0 = 0;
    const loop = (now) => { if (!playing) return; frame = Math.min(FRAMES - 1, f0 + Math.floor(((now - t0) / 1000) * FPS)); show(); requestAnimationFrame(loop); };
    document.getElementById('play').onclick = (e) => { playing = !playing; e.target.textContent = playing ? 'pause' : 'play'; if (playing) { t0 = performance.now(); f0 = frame; requestAnimationFrame(loop); } };
    addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') { frame = Math.min(FRAMES - 1, frame + (e.shiftKey ? FPS : 1)); show(); } if (e.key === 'ArrowLeft') { frame = Math.max(0, frame - (e.shiftKey ? FPS : 1)); show(); } if (e.key === ' ') document.getElementById('play').click(); });
    show();
  }
</script>
</body>
</html>
